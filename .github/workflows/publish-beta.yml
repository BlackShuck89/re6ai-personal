name: Publish initial 1.1.0 beta

# This runs once when the workflow is first added to master.
# Subsequent versions are released by pushing version tags with build.yml.
on:
  push:
    branches:
      - master
    paths:
      - ".github/workflows/publish-beta.yml"

permissions:
  contents: write

jobs:
  beta:
    runs-on: ubuntu-latest
    env:
      GIT_TAG_NAME: v1.1.0-beta.1
    steps:
      - name: Check out beta source
        uses: actions/checkout@v4
      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Verify beta package version
        run: |
          test "$(node -p 'require("./package.json").version')" = "1.1.0-beta.1"
      - name: Typecheck, lint and compile code
        run: bun run compile-typescript:prod
      - name: Compile stylesheet
        run: bun run compile-sass:prod
      - name: Build beta userscript
        run: bun run compose-userscript:prod
      - name: Verify beta release files
        run: |
          test -s build/userscript/script.user.js
          test -s build/userscript/script.meta.js
          grep -Eq '^// @version +1\.1\.0-beta\.1$' build/userscript/script.meta.js
          grep -Fq 'releases/download/v1.1.0-beta.1/script.user.js' build/userscript/script.user.js
          grep -Fq 'releases/download/v1.1.0-beta.1/script.meta.js' build/userscript/script.user.js
      - name: Publish beta prerelease
        uses: ncipollo/release-action@v1
        with:
          tag: v1.1.0-beta.1
          commit: ${{ github.sha }}
          name: re6AI Personal 1.1.0 Beta 1
          bodyFile: docs/releases/v1.1.0-beta.1.md
          artifacts: "build/userscript/script.user.js,build/userscript/script.meta.js,build/userscript/altver.user.js,build/userscript/altver.meta.js"
          prerelease: true
          makeLatest: false
          allowUpdates: false
