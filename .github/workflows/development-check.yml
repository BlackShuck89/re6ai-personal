name: Development checks

on:
  pull_request:
  push:
    branches:
      - development

jobs:
  userscript:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Typecheck and lint
        run: |
          bun run eslint
          bun run typescript
      - name: Compile script
        run: |
          bun run browserify
          bun run minify
          bun run template
      - name: Compile stylesheet
        run: |
          bun run sass:prod
          bun run autoprefixer
      - name: Build userscript
        run: bun run compose-userscript:prod
      - name: Assert generated artifact
        run: |
          test -s build/userscript/script.user.js
          grep -q 're6AI Personal' build/userscript/script.user.js
          grep -q 'BlackShuck89/re6ai-personal/releases/latest/download' build/userscript/script.user.js
      - name: Upload test artifact
        uses: actions/upload-artifact@v4
        with:
          name: re6ai-personal-development-userscript
          path: build/userscript/script.user.js
          retention-days: 7
